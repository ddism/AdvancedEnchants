# ============================================================
#  custom.yml —— 你的自定义附魔（升级插件不会覆盖本文件）
#
#  这是「玩家/服主自行设计附魔」的入口：完全用 YAML 描述，
#  不需要写 Java 代码、不需要重新编译。改完执行 /ae reload 生效。
#
#  写法速查（完整字段见 docs/SCHEMA.md）：
#    triggers.<触发器>.chance / chance-per-level / cooldown / conditions / actions
#    数值字段：base（1 级值）、per-level（每级增量）、max（上限）
#             scale：LINEAR / QUADRATIC / EXPONENTIAL / DIMINISHING
#    description 里的 {value} = 第一个 action 在当前等级的数值
#
#  本文件默认不注册任何附魔（保持开箱纯净）。
#  下面这些示例都是注释，取消注释即可使用；也可以直接抄下面「常用片段」。
# ============================================================

enchants: {}

