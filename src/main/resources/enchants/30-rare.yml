    triggers:
      ON_BLOCK_BREAK:
        cooldown: 0
        conditions:
          - type: BLOCK
            value: ["*_ORE", SAND, RED_SAND, COBBLESTONE, CLAY, CACTUS]
        actions:
          # SCHEMA 缺口: AUTO_SMELT 只文档化 multiplier，等级缩放借用通用 base/per-level/max。
          - type: AUTO_SMELT
            multiplier: 2
            base: 2
            per-level: 0.5
            max: 3.5
          - type: PARTICLE
            particle: FLAME
            count: 8
            spread: 0.4
            who: BLOCK
          - type: SOUND
            sound: BLOCK_FURNACE_FIRE_CRACKLE
            volume: 0.5
            pitch: 1.0

  compressor:
