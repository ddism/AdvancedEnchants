            per-level: 0.75
            max: 4.0
      ON_FISH:
        cooldown: 0.5
        actions:
          - type: PARTICLE
            particle: ENCHANT
            count: 12
            spread: 0.6
            who: SELF
          - type: SOUND
            sound: ENTITY_EXPERIENCE_ORB_PICKUP
            volume: 0.7
            pitch: 1.4

  rocket_jump:
    display: "&b火箭助推"
    tier: RARE
    max-level: 3
    types: [ELYTRA]
    description:
      - "&7滑翔时右键获得额外推力 &f{value}"
      - "&7冷却 &f5 &7秒，并消耗鞘翅耐久"
      - "&8SCHEMA 缺口：无「滑翔中」条件，以高度区间近似"
