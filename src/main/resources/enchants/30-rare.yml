            base: 0.2
            per-level: 0.1
            max: 0.5
            material: IRON_BLOCK
          - type: PARTICLE
            particle: CRIT
            count: 6
            spread: 0.4
            who: BLOCK
          - type: SOUND
            sound: BLOCK_PISTON_CONTRACT
            volume: 0.5
            pitch: 1.4

  junk_to_treasure:
    display: "&a变废为宝"
    tier: RARE
    max-level: 3
    types: [FISHING_ROD]
    description:
      - "&7钓到垃圾时按 &f{value} &7的比例概率转化为可用资源"
      - "&7（铁锭，另有概率变为金锭）"
      - "&8SCHEMA 缺口：无法判断钓获物是否为「垃圾」，改为对渔获判定"
    triggers:
      ON_FISH:
        cooldown: 0.5
        actions:
          - type: CONVERT_DROP
            base: 0.5
            per-level: 0.15
            max: 0.9
            material: IRON_INGOT
          - type: CONVERT_DROP
            base: 0.25
            per-level: 0.1
            max: 0.6
            material: GOLD_INGOT
          - type: PARTICLE
            particle: SPLASH
            count: 10
            spread: 0.5
            who: SELF
          - type: SOUND
            sound: ENTITY_FISHING_BOBBER_SPLASH
            volume: 0.6
            pitch: 1.2

  xp_fisher:
    display: "&e垂钓达人"
    tier: RARE
    max-level: 3
    types: [FISHING_ROD]
    description:
      - "&7钓鱼获得的经验大幅提升：经验获取 ×&f2.0 &7（每级 &f+0.75&7，上限 &f4.0&7）"
