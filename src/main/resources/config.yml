# ============================================================
#  AdvancedEnchants 主配置
#  改完执行 /ae reload 即可生效（无需重启）
# ============================================================

# 单件物品最多可拥有的自定义附魔条数（防止 PDC 与 Lore 无限膨胀）
max-enchants-per-item: 12

# PASSIVE 触发器的检查间隔（tick，20 = 1 秒）。降低会让光环类附魔更灵敏，但更耗性能。
passive-interval-ticks: 20

# 调试：开启后，附魔触发时会向玩家发送一条提示（含附魔 ID 与等级）
debug: false

# ------------------------------------------------------------
#  安全开关（重要）
# ------------------------------------------------------------

# 是否允许附魔修改地形（连锁挖矿、爆破箭、地形塑造等）
allow-terrain-changes: true

# 是否允许附魔执行命令（COMMAND 动作）。默认关闭：防止配置被滥用为提权途径。
allow-commands: false

# 是否允许 RUN_SCRIPT（预留能力，默认关闭）
allow-scripts: false

# 是否保护容器类方块（箱子/熔炉/潜影盒等）不被附魔范围破坏
protect-block-containers: true

# ------------------------------------------------------------
#  附魔随机权重
#  用途：附魔条目未写 rarity-weight 时使用的默认权重（按等级）。
#  数值越大越常见；会被附魔条目里的 rarity-weight 覆盖。
#  改完 /ae reload 生效（可用 /ae info <ID> 查看某条的实际权重）。
# ------------------------------------------------------------
tier-weights:
  COMMON: 100
  UNCOMMON: 55
  RARE: 26
  EPIC: 10
  LEGENDARY: 4
  MYTHIC: 1

# ------------------------------------------------------------
#  附魔条件用的权限节点（可选）
#  想让某条附魔「只有特定玩家生效」，在附魔里加：
#    conditions:
#      - type: PERMISSION
#        value: "advancedenchants.enchant.vip"
#  节点命名约定：advancedenchants.enchant.<附魔ID 或 自定义后缀>
#  这里不需要注册节点，权限插件里直接给玩家分配即可。
# ------------------------------------------------------------

# ------------------------------------------------------------
#  铁砧与附魔台
#  说明（v1.0 实际实现情况，避免误解）：
#   - 铁砧叠加：由本插件叠加「同名附魔」的升级逻辑已实现（见 EnchantLoader 的 max-level 限制）；
#     但 config.yml 里的额外「消耗经验等级」尚未接入，因此这里不提供该开关。
#   - 附魔台随机池：尚未实现，因此不提供 enchanting-table 配置段。
#     当前获取途径：/ae give、/ae enchant、铁砧叠加附魔书、战利品箱自行投放附魔书。
#   - 磨刀石剥离：已实现，见下方 grindstone.strip-enabled。
# ------------------------------------------------------------

# 磨刀石：是否允许磨掉自定义附魔
grindstone:
  strip-enabled: true

