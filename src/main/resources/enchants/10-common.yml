# AdvancedEnchants - 普通级附魔
# 数据来源：docs/ENCHANT_ROSTER.md 中 tier=COMMON 的全部条目（逐条共 24 条）
# 写法规范：docs/SCHEMA.md（触发器 / 条件 / 动作 全部取自规范表，无自创 type）
# 百分比类比例动作（LIFESTEAL / DAMAGE_REDUCE / REFLECT / MARK / CONVERT_DROP / DODGE）
# 的 base 按规范写 0~1 小数：0.05 = 5%。
enchants:
  lifesteal:
    display: "&c吸血"
    tier: COMMON
    max-level: 3
    types: [SWORD, AXE]
    description:
      - "&7造成伤害的 &f{value} &7回复自身生命（每级 +5%%，0.05 = 5%%）"
    conflicts: [vampiric_aura, soul_eater]
    triggers:
      ON_HIT:
        cooldown: 0
        actions:
          - type: LIFESTEAL
            base: 0.05
            per-level: 0.05
            max: 0.15
            scale: LINEAR
          - type: PARTICLE
            particle: HEART
            count: 4
            spread: 0.3
            who: SELF
          - type: SOUND
            sound: ENTITY_EXPERIENCE_ORB_PICKUP
            volume: 0.4
            pitch: 1.6

  keen_edge:
    display: "&e锋利之刃"
    tier: COMMON
