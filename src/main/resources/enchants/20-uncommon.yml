  auto_reel:                          # 99 自动收竿 UNCOMMON FISHING_ROD
    # SCHEMA 无「自动收竿 / 自动重新抛竿」动作：用咬钩提示 + 音效 + 渔获加成近似
    display: "&b自动收竿"
    tier: UNCOMMON
    max-level: 3
