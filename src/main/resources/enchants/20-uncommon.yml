        conditions:
          - type: BLOCK
            value: [SAND, RED_SAND, DIRT, COARSE_DIRT, ROOTED_DIRT, PODZOL, MYCELIUM, GRAVEL, SNOW_BLOCK, SNOW, MOSS_BLOCK]
