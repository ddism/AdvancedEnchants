            value: 0.2
            mode: BELOW
          - type: CHANCE
            value: 20
            per-level: 10
        actions:
          - type: EXECUTE
            base: 0.2
            per-level: 0.05
            max: 0.3
            damage: 14.0
          - type: TRUE_DAMAGE
            base: 6
            per-level: 3
            max: 14
          - type: DURABILITY
            base: 100
            per-level: 50
            max: 250
